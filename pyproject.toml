[build-system]
requires = ["setuptools>=46.1.0", "setuptools_scm[toml]>=5"]
build-backend = "setuptools.build_meta"

[project]
name = "snakestream"
description = "Java like streams for snakes"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Tommy Derngren", email = "tommy.derngren@hiq.se" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/carby/snakestream/wiki"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
addopts = "--cov snakestream --cov-report term-missing --verbose"
norecursedirs = ["dist", "build", ".tox", ".virtualenv"]
testpaths = ["tests"]

[tool.coverage.run]
# branch = true folds branch-arc coverage into the same "percent covered"
# figure as line coverage, so CI's --cov-fail-under=98 (see check.yml)
# already gates on combined line+branch coverage, not line coverage alone.
branch = true
source = ["snakestream"]

[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "UP"]
mccabe = { max-complexity = 10 }
