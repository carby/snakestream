name: Check

on:
  push:
    branches:
      - '*'         # matches every branch that doesn't contain a '/'
      - '*/*'       # matches every branch containing a single '/'
      - '**'        # matches every branch
      - '!master'   # excludes master

permissions:
  contents: read

jobs:
  code_check:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest

    # Branch-coverage arcs for async for-loops compile differently across
    # CPython versions, which makes coverage.py report spurious partial
    # branches on 3.8/3.9. Only gate on the newest matrix version, where
    # the numbers are accurate, so the older interpreters don't fail CI
    # on a measurement artifact rather than a real regression.
    - name: Enforce coverage threshold
      if: matrix.python-version == '3.12'
      run: |
        pytest --cov-fail-under=98
