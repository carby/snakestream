name: Check

on:
  push:
    branches:
      - '*'         # matches every branch that doesn't contain a '/'
      - '*/*'       # matches every branch containing a single '/'
      - '**'        # matches every branch
      - '!master'   # excludes master
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_check:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.14t"]

    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Lint with ruff
      run: |
        uv run ruff check --select=E9,F63,F7,F82 .
        uv run ruff check .
        uv run ruff format --check .

    - name: Test with pytest
      run: uv run pytest

    # ty, pip-audit and the coverage threshold don't vary by interpreter
    # build (GIL-enabled vs free-threaded), so with two legs they'd be
    # redundant on the second; run them once, on the GIL-enabled leg.
    - name: Type check with ty
      if: matrix.python-version == '3.14'
      run: uv run ty check src

    - name: Audit dependencies for vulnerabilities
      if: matrix.python-version == '3.14'
      run: uv run --with pip-audit pip-audit

    - name: Enforce coverage threshold
      if: matrix.python-version == '3.14'
      run: uv run pytest --cov-fail-under=98

  install_smoke_test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}

    # A plain venv + `pip install .`, not `uv sync`, so this exercises the
    # same build (setuptools.build_meta) and install path a real
    # `pip install snakestream` user hits. `uv venv` is only used to
    # provision the venv with the matrix's Python version; `--seed` is
    # required so `pip` actually exists inside the venv (uv venv omits it
    # by default), otherwise `pip install .` silently falls through to a
    # pip outside the venv and installs to user site-packages instead.
    - name: Create a clean virtual environment
      run: uv venv --seed --python ${{ matrix.python-version }} .venv

    - name: Install the built package
      run: |
        source .venv/bin/activate
        pip install .

    # Run from outside the repo checkout so a stray sys.path[0] entry
    # can't make this pass by resolving `snakestream` from the local
    # src/ layout instead of the installed distribution.
    - name: Import the installed package
      run: |
        source .venv/bin/activate
        cd "$RUNNER_TEMP"
        python -c "import snakestream"
