name: Check

on:
  push:
    branches:
      - '*'         # matches every branch that doesn't contain a '/'
      - '*/*'       # matches every branch containing a single '/'
      - '**'        # matches every branch
      - '!master'   # excludes master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_check:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Lint with ruff
      run: |
        uv run ruff check --select=E9,F63,F7,F82 .
        uv run ruff check .

    - name: Test with pytest
      run: uv run pytest

    # Branch-coverage arcs for async for-loops compile differently across
    # CPython versions, which makes coverage.py report spurious partial
    # branches on older interpreters. Only gate on the newest matrix
    # version, where the numbers are accurate, so the older interpreters
    # don't fail CI on a measurement artifact rather than a real
    # regression.
    - name: Enforce coverage threshold
      if: matrix.python-version == '3.14'
      run: uv run pytest --cov-fail-under=98
