name: Check

on:
  push:
    branches:
      - '*'         # matches every branch that doesn't contain a '/'
      - '*/*'       # matches every branch containing a single '/'
      - '**'        # matches every branch
      - '!master'   # excludes master

permissions:
  contents: read

jobs:
  code_check:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Lint with ruff
      run: |
        uv run ruff check --select=E9,F63,F7,F82 .
        uv run ruff check .

    - name: Test with pytest
      run: uv run pytest

    # Branch-coverage arcs for async for-loops compile differently across
    # CPython versions, which makes coverage.py report spurious partial
    # branches on 3.8/3.9. Only gate on the newest matrix version, where
    # the numbers are accurate, so the older interpreters don't fail CI
    # on a measurement artifact rather than a real regression.
    - name: Enforce coverage threshold
      if: matrix.python-version == '3.12'
      run: uv run pytest --cov-fail-under=98
